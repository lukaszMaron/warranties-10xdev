[project]
name = "warranties-10xdev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Łukasz Maroń", email = "luk220698@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.0",
    "filelock>=3.0",
    "fastapi>=0.142.2",
    "pillow>=11.0.0",
    "pypdfium2>=4.30.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["httpx2>=0.1.0", "pytest>=8.0", "pre-commit>=4.0,<5", "ruff>=0.14,<1"]

[project.scripts]
warranties-10xdev = "warranties_10xdev:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "agent-hooks.test.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
